name: CI PR a develop

on:
  pull_request:
    branches: [develop]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations_v4/**"
      - "scripts/**"
      - "Dockerfile"
      - ".github/workflows/ci-pr.yml"

concurrency:
  group: ponti-backend-ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPRIVATE: github.com/devpablocristo/*
  PLATFORM_MODULES: >-
    github.com/devpablocristo/platform/authn/go
    github.com/devpablocristo/platform/databases/postgres/go
    github.com/devpablocristo/platform/errors/go
    github.com/devpablocristo/platform/kernels/governance/go
    github.com/devpablocristo/platform/http/gin/go
    github.com/devpablocristo/platform/http/go
    github.com/devpablocristo/platform/notifications/go
    github.com/devpablocristo/platform/security/go
    github.com/devpablocristo/platform/validate/go

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private Go modules
        run: git config --global url."https://${{ secrets.CORE_REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        run: |
          for module in $PLATFORM_MODULES; do go mod download "$module"; done
          go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check new migrations are idempotent
        run: |
          set -euo pipefail
          base="refs/remotes/origin/${{ github.base_ref }}"
          if ! git fetch --no-tags origin "${{ github.base_ref }}":"$base" 2>/dev/null; then
            echo "Base ref ${{ github.base_ref }} no disponible; skip."; exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM "$base...HEAD" -- 'migrations_v4/*.up.sql' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "Sin migraciones nuevas/modificadas."; exit 0
          fi
          bash scripts/check-migrations-idempotent.sh "${CHANGED[@]}"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private Go modules
        run: git config --global url."https://${{ secrets.CORE_REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        run: |
          for module in $PLATFORM_MODULES; do go mod download "$module"; done
          go mod download

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private Go modules
        run: git config --global url."https://${{ secrets.CORE_REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        run: |
          for module in $PLATFORM_MODULES; do go mod download "$module"; done
          go mod download

      - name: Tests
        run: go test ./...

  # Security scan opcional (no bloquea el PR)
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private Go modules
        run: git config --global url."https://${{ secrets.CORE_REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        run: |
          for module in $PLATFORM_MODULES; do go mod download "$module"; done
          go mod download

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
